capture:
  interface: eth0
  snaplen: 65535

snmp:
  listen: "0.0.0.0:161"
  pen: 55555
  # oid_base: "1.3.6.1.4.1.55555"
  oid_suffix:
    queue_count: ".1.1.1.0"
    target_name: ".1.1.2.1.1.2"
    bytes_in: ".1.1.2.1.1.8"
    bytes_out: ".1.1.2.1.1.9"
  communities:
    - community: "mrtgSecret"
      allowed:
        - "10.0.0.50"
        - "192.168.1.0/24"

http:
  listen: "0.0.0.0:8080"
  allowed:
    - "192.168.10.0/24"
  # session_secret: auto-generated when login (.env) is enabled; rotate in Settings

queues:
  - index: 1
    target: "10.0.0.0/24"
    label: "Customers"

meta:
  next_index: 2
